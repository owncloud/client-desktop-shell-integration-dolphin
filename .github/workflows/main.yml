name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    name: Build plugins
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed # zizmor: ignore[unpinned-images] rolling release, published only as latest; the build tracks current KF6/Qt6
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout resources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: owncloud/client-desktop-shell-integration-resources
          path: resources
          persist-credentials: false

      - name: Install dependencies
        run: |
          zypper install -y cmake ninja "cmake(KF6KIO)" "cmake(Qt6Core)" tree

      - name: Install resources
        run: |
          mkdir resources/build
          pushd resources/build
          cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo -G Ninja
          ninja install
          popd

      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo -G Ninja
          ninja
          env DESTDIR=out ninja install
          tree out
